name: WearFlow ERP CI/CD Pipeline

# Kod master yoki main branchga push qilinganda pipeline ishga tushadi
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repozitoriyadagi kodimizni yuklab oladi
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. AWS serverimiz bilan xavfsiz bog'lanish uchun SSH kalitni sozlaydi
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      # 3. AWS server ichiga kirib, Docker konteynerni avtomatik yangilaydi
      - name: Deploy to AWS EC2 via Docker
        run: |
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.AWS_EC2_PUBLIC_IP }} << 'EOF'
            # Loyiha papkasiga o'tamiz (yoki yaratamiz)
            mkdir -p wearflow-app && cd wearflow-app
          
            # GitHub Actions yuborgan fayllarni qabul qilamiz (amaliyotda repo klon qilinadi)
            # Eski ishlab turgan konteynerni to'xtatamiz va o'chiramiz
            sudo docker stop wearflow-running-instance || true
            sudo docker rm wearflow-running-instance || true
          
            # Yangi o'zgarishlar bilan obrazni qayta build qilamiz
            sudo docker build -t wearflow-prod-app .
          
            # Ishlab chiqarish (Production) muhitida 80-portda yoqamiz
            sudo docker run -d --name wearflow-running-instance -p 80:3000 wearflow-prod-app
          EOF